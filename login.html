<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirish — VCreator.uz</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0f0e0c; --ink2: #3a3830; --muted: #8a8880;
    --bg: #f5f3ee; --bg2: #edeae3; --accent: #c94f1e; --accent2: #e8722a;
    --white: #faf9f6; --border: rgba(15,14,12,0.1);
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 0 2rem; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(245,243,238,0.92); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse-dot 2s ease-in-out infinite; }
  @keyframes pulse-dot { 0%,100%{transform:scale(1)}50%{transform:scale(1.4);opacity:0.7} }
  .nav-links { display: flex; align-items: center; gap: 2rem; list-style: none; }
  .nav-links a { text-decoration: none; font-size: 0.875rem; color: var(--ink2); transition: color 0.2s; }
  .nav-links a:hover { color: var(--accent); }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
    pointer-events: none;
  }
  .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 80px 1.5rem 3rem; position: relative; z-index: 1; }
  .auth-card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 24px; padding: 2.5rem; width: 100%; max-width: 420px;
    position: relative; overflow: hidden;
    box-shadow: 0 24px 64px rgba(15,14,12,0.08);
    animation: fadeInUp 0.6s ease both;
  }
  .auth-card::before { content:''; position:absolute; top:0;left:0;right:0;height:3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .auth-tabs { display:flex; background:var(--bg2); border-radius:100px; padding:4px; margin-bottom:2rem; }
  .auth-tab { flex:1; text-align:center; padding:9px; border-radius:100px; font-size:0.875rem; color:var(--muted); text-decoration:none; transition:all 0.2s; }
  .auth-tab.active { background:var(--white); color:var(--ink); font-weight:500; box-shadow:0 2px 8px rgba(15,14,12,0.08); }
  .auth-title { font-family:'Syne',sans-serif; font-weight:800; font-size:1.9rem; letter-spacing:-0.03em; color:var(--ink); margin-bottom:6px; }
  .auth-sub { font-size:0.9rem; color:var(--muted); font-weight:300; margin-bottom:2rem; }
  .alert { display:none; padding:12px 16px; border-radius:12px; font-size:0.85rem; margin-bottom:1rem; }
  .alert.error { background:#fff1f0; color:#c0392b; border:1px solid #fcd5d0; display:block; }
  .alert.success { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; display:block; }
  .form-group { margin-bottom: 1.2rem; }
  .form-label { display:block; font-size:0.82rem; font-weight:500; color:var(--ink2); margin-bottom:7px; }
  .form-input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px 16px; font-size:0.9rem; font-family:'DM Sans',sans-serif; color:var(--ink); outline:none; transition:border-color 0.2s, box-shadow 0.2s; }
  .form-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(201,79,30,0.08); }
  .form-input::placeholder { color:var(--muted); }
  .form-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; }
  .form-check { display:flex; align-items:center; gap:8px; cursor:pointer; }
  .form-check input { accent-color:var(--accent); }
  .form-check span { font-size:0.82rem; color:var(--ink2); }
  .form-link { font-size:0.82rem; color:var(--accent); text-decoration:none; }
  .btn-submit { width:100%; background:var(--ink); color:var(--white); border:none; border-radius:100px; padding:14px; font-size:0.95rem; font-weight:500; font-family:'DM Sans',sans-serif; cursor:pointer; transition:background 0.2s, transform 0.15s; position:relative; overflow:hidden; }
  .btn-submit::before { content:''; position:absolute; inset:0; background:var(--accent); transform:translateX(-100%); transition:transform 0.3s; border-radius:inherit; }
  .btn-submit:hover::before { transform:translateX(0); }
  .btn-submit span { position:relative; z-index:1; }
  .btn-submit:hover { transform:translateY(-1px); }
  .btn-submit:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .divider { display:flex; align-items:center; gap:1rem; margin:1.5rem 0; color:var(--muted); font-size:0.8rem; }
  .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
  .btn-google { width:100%; background:var(--white); border:1px solid var(--border); border-radius:100px; padding:12px; font-size:0.875rem; font-family:'DM Sans',sans-serif; color:var(--ink2); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:border-color 0.2s, background 0.2s, transform 0.15s; }
  .btn-google:hover { border-color:var(--ink); background:var(--bg); transform:translateY(-1px); }
  .auth-footer-text { text-align:center; margin-top:1.5rem; font-size:0.85rem; color:var(--muted); }
  .auth-footer-text a { color:var(--accent); text-decoration:none; font-weight:500; }
  @keyframes fadeInUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @media(max-width:640px){ nav{padding:0 1rem} .nav-links{display:none} .auth-card{padding:2rem 1.5rem} }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo"><div class="logo-dot"></div>VCreator.uz</a>
  <ul class="nav-links">
    <li><a href="index.html">Bosh sahifa</a></li>
    <li><a href="dizaynerlar.html">Dizaynerlar</a></li>
    <li><a href="loyihalar.html">Loyihalar</a></li>
  </ul>
</nav>
<div class="bg-grid"></div>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-tabs">
      <a href="login.html" class="auth-tab active">Kirish</a>
      <a href="signup.html" class="auth-tab">Ro'yxatdan o'tish</a>
    </div>
    <div class="auth-title">Xush kelibsiz</div>
    <div class="auth-sub">Akkauntingizga kiring</div>
    <div class="alert" id="alertBox"></div>
    <div class="form-group">
      <label class="form-label">Email manzil</label>
      <input type="email" class="form-input" id="emailInput" placeholder="sizning@email.com">
    </div>
    <div class="form-group">
      <label class="form-label">Parol</label>
      <input type="password" class="form-input" id="passwordInput" placeholder="••••••••">
    </div>
    <div class="form-row">
      <label class="form-check"><input type="checkbox"> <span>Eslab qolish</span></label>
      <a href="#" class="form-link">Parolni unutdingizmi?</a>
    </div>
    <button class="btn-submit" id="loginBtn" onclick="handleLogin()">
      <span id="loginBtnText">Kirish →</span>
    </button>
    <div class="divider">yoki</div>
    <button class="btn-google" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google bilan kirish
    </button>
    <div class="auth-footer-text">Akkauntingiz yo'qmi? <a href="signup.html">Ro'yxatdan o'ting</a></div>
  </div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC9Ex4rMhqqP5z48mdFwijsGZW-BJIv2Tw",
    authDomain: "vcreator-a854f.firebaseapp.com",
    projectId: "vcreator-a854f",
    storageBucket: "vcreator-a854f.firebasestorage.app",
    messagingSenderId: "648815678229",
    appId: "1:648815678229:web:404b25bed0514eb8b08f1c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = "profil.html";
  });

  function showAlert(msg, type) {
    const box = document.getElementById('alertBox');
    box.textContent = msg;
    box.className = 'alert ' + type;
  }

  function setLoading(on) {
    const btn = document.getElementById('loginBtn');
    const txt = document.getElementById('loginBtnText');
    btn.disabled = on;
    txt.innerHTML = on ? '<span class="spinner"></span>Kirilmoqda...' : 'Kirish →';
  }

  window.handleLogin = async function() {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    if (!email || !password) { showAlert("Email va parolni kiriting!", "error"); return; }
    setLoading(true);
    try {
      await signInWithEmailAndPassword(auth, email, password);
      showAlert("Muvaffaqiyatli kirdingiz!", "success");
      setTimeout(() => window.location.href = "profil.html", 800);
    } catch (err) {
      const msgs = {
        'auth/user-not-found': "Bu email bilan akkaunt topilmadi",
        'auth/wrong-password': "Parol noto'g'ri",
        'auth/invalid-email': "Email manzil noto'g'ri",
        'auth/too-many-requests': "Ko'p urinish. Biroz kuting",
        'auth/invalid-credential': "Email yoki parol noto'g'ri",
      };
      showAlert(msgs[err.code] || "Xatolik: " + err.message, "error");
    } finally { setLoading(false); }
  };

  window.handleGoogleLogin = async function() {
    try {
      await signInWithPopup(auth, provider);
      window.location.href = "profil.html";
    } catch (err) {
      showAlert("Google bilan kirishda xatolik yuz berdi", "error");
    }
  };

  document.getElementById('passwordInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') window.handleLogin();
  });
</script>
</body>
</html>
