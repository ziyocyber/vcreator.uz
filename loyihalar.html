<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loyihalar — VCreator.uz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: white; }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 60px;
            background: #111;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 22px; font-weight: 800; color: #7C3AED; text-decoration: none; }
        .nav-links { display: flex; align-items: center; gap: 32px; }
        .nav-links a { color: #888; text-decoration: none; font-size: 15px; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: white; }
        .btn-nav { background: #7C3AED !important; color: white !important; padding: 9px 22px; border-radius: 8px; font-weight: 600 !important; font-size: 14px !important; }
        .btn-profil { display: flex; align-items: center; gap: 8px; background: #0a0a0a !important; color: white !important; padding: 8px 16px; border-radius: 8px; font-weight: 600 !important; font-size: 14px !important; border: 1px solid #222; text-decoration: none; }
        .mini-avatar { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #7C3AED, #3B82F6); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }

        .hero { text-align: center; padding: 80px 20px 40px; }
        .hero h1 { font-size: 42px; font-weight: 800; }
        .hero h1 span { color: #7C3AED; }
        .hero p { color: #aaa; margin-top: 12px; font-size: 18px; }
        .hero-btns { display: flex; gap: 14px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
        .btn-primary { background: #7C3AED; color: white; padding: 13px 28px; border-radius: 9px; font-size: 15px; font-weight: 700; text-decoration: none; transition: background 0.2s; display: inline-block; }
        .btn-primary:hover { background: #6D28D9; }

        .filter { display: flex; justify-content: center; gap: 12px; padding: 30px 20px; flex-wrap: wrap; }
        .filter button { background: #111; color: white; border: 1px solid #333; padding: 10px 24px; border-radius: 30px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .filter button:hover, .filter button.active { background: #7C3AED; border-color: #7C3AED; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; padding: 20px 60px 80px; max-width: 1200px; margin: 0 auto; }

        .card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 24px; transition: transform 0.2s, border-color 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: #333; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
        .category { background: #7C3AED20; border: 1px solid #7C3AED40; color: #7C3AED; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-open { background: #10B98120; border: 1px solid #10B98140; color: #10B981; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .card h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
        .card p { color: #888; font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
        .card-info { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
        .info-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #aaa; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1a1a1a; padding-top: 14px; }
        .budget { font-size: 15px; font-weight: 800; color: #7C3AED; }
        .budget span { font-size: 12px; color: #aaa; font-weight: normal; }
        .btn-apply { background: #7C3AED; color: white; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.2s; text-decoration: none; display: inline-block; }
        .btn-apply:hover { background: #6D28D9; }

        .loading { text-align: center; padding: 60px 20px; color: #888; font-size: 16px; }
        .empty { text-align: center; padding: 80px 20px; }
        .empty h3 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
        .empty p { color: #888; margin-bottom: 24px; }

        footer { text-align: center; padding: 30px; color: #555; border-top: 1px solid #222; font-size: 14px; }

        @media (max-width: 768px) {
            nav { padding: 16px 20px; }
            .grid { padding: 20px 16px 60px; }
            .hero h1 { font-size: 28px; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">VCreator.uz</a>
    <div class="nav-links">
        <a href="index.html">Bosh sahifa</a>
        <a href="dizaynerlar.html">Dizaynerlar</a>
        <a href="loyihalar.html" class="active">Loyihalar</a>
        <div id="authBtn">
            <a href="login.html" class="btn-nav">Kirish</a>
        </div>
    </div>
</nav>

<div class="hero">
    <h1>Ochiq <span>loyihalar</span></h1>
    <p>Dizaynerlar uchun eng so'nggi loyihalar</p>
    <div class="hero-btns">
        <a href="loyihani.html" class="btn-primary">+ Loyiha joylash</a>
    </div>
</div>

<div class="filter">
    <button class="active" onclick="filterCards('Hammasi', this)">Hammasi</button>
    <button onclick="filterCards('Logo dizayn', this)">Logo</button>
    <button onclick="filterCards('UI/UX', this)">UI/UX</button>
    <button onclick="filterCards('Brending', this)">Brending</button>
    <button onclick="filterCards('Illustratsiya', this)">Illustratsiya</button>
    <button onclick="filterCards('Motion', this)">Motion</button>
</div>

<div id="loading" class="loading">⏳ Loyihalar yuklanmoqda...</div>

<div class="grid" id="grid" style="display:none"></div>

<div id="empty" class="empty" style="display:none">
    <h3>Hozircha loyihalar yo'q</h3>
    <p>Birinchi bo'lib loyiha joylang!</p>
    <a href="loyihani.html" class="btn-primary">+ Loyiha joylash</a>
</div>

<footer><p>© 2026 VCreator.uz — Barcha huquqlar himoyalangan</p></footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC9Ex4rMhqqP5z48mdFwijsGZW-BJIv2Tw",
        authDomain: "vcreator-a854f.firebaseapp.com",
        projectId: "vcreator-a854f",
        storageBucket: "vcreator-a854f.firebasestorage.app",
        messagingSenderId: "648815678229",
        appId: "1:648815678229:web:404b25bed0514eb8b08f1c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let allLoyihalar = [];

    // Auth holati
    onAuthStateChanged(auth, (user) => {
        const authBtn = document.getElementById('authBtn');
        if (user) {
            const name = user.displayName || user.email;
            const initial = name.charAt(0).toUpperCase();
            authBtn.innerHTML = `
                <a href="profil.html" class="btn-profil">
                    <div class="mini-avatar">${initial}</div>
                    ${name.split(' ')[0]}
                </a>`;
        } else {
            authBtn.innerHTML = `<a href="login.html" class="btn-nav">Kirish</a>`;
        }
    });

    // Loyihalarni Firestoredan yuklash
    async function loadLoyihalar() {
        try {
            const q = query(collection(db, "loyihalar"), orderBy("createdAt", "desc"));
            const snapshot = await getDocs(q);
            allLoyihalar = [];
            snapshot.forEach(doc => {
                allLoyihalar.push({ id: doc.id, ...doc.data() });
            });
            renderCards(allLoyihalar);
        } catch (e) {
            console.error(e);
            document.getElementById('loading').textContent = 'Xatolik yuz berdi. Sahifani yangilang.';
        }
    }

    function timeAgo(dateStr) {
        const diff = Date.now() - new Date(dateStr).getTime();
        const mins = Math.floor(diff / 60000);
        const hours = Math.floor(diff / 3600000);
        const days = Math.floor(diff / 86400000);
        if (mins < 60) return `${mins} daqiqa oldin`;
        if (hours < 24) return `${hours} soat oldin`;
        return `${days} kun oldin`;
    }

    function renderCards(loyihalar) {
        const grid = document.getElementById('grid');
        const loading = document.getElementById('loading');
        const empty = document.getElementById('empty');

        loading.style.display = 'none';

        if (loyihalar.length === 0) {
            grid.style.display = 'none';
            empty.style.display = 'block';
            return;
        }

        empty.style.display = 'none';
        grid.style.display = 'grid';
        grid.innerHTML = loyihalar.map(l => `
            <div class="card" data-cat="${l.category}">
                <div class="card-top">
                    <span class="category">${l.category}</span>
                    <span class="status-open">Ochiq</span>
                </div>
                <h3>${l.title}</h3>
                <p>${l.description.length > 100 ? l.description.substring(0, 100) + '...' : l.description}</p>
                <div class="card-info">
                    <div class="info-item">⏰ ${timeAgo(l.createdAt)}</div>
                    <div class="info-item">👤 ${l.authorName || 'Noma\'lum'}</div>
                    <div class="info-item">📅 ${l.deadline}</div>
                </div>
                <div class="card-footer">
                    <div class="budget">${l.budget}</div>
                    <a href="https://t.me/${l.telegram.replace('@','')}" target="_blank" class="btn-apply">Bog'lanish</a>
                </div>
            </div>
        `).join('');
    }

    window.filterCards = function(cat, btn) {
        document.querySelectorAll('.filter button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (cat === 'Hammasi') {
            renderCards(allLoyihalar);
        } else {
            renderCards(allLoyihalar.filter(l => l.category === cat));
        }
    };

    loadLoyihalar();
</script>
</body>
</html>
